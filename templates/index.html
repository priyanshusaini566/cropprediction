<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Crop Recommendation System</title>

    <!-- Favicon -->
    <link
      rel="icon"
      type="image/png"
      href="{{ url_for('static', filename='images/leaf_favicon.png') }}"
    />

    <!-- Link to external CSS file -->
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='css/styles.css') }}"
    />
  </head>
  <body>
    <!-- Main Container -->
    <div class="container">
      <h1>🌾 Smart Crop Recommendation System</h1>
      <p class="subtitle">
        Get the best crop recommendations for your soil and weather conditions
      </p>

      <form id="cropForm">
        <div class="form-grid">
          <div class="input-group">
            <label for="N">Nitrogen (N)</label>
            <input
              type="number"
              id="N"
              name="N"
              value="70"
              min="0"
              max="140"
              required
            />
          </div>

          <div class="input-group">
            <label for="P">Phosphorus (P)</label>
            <input
              type="number"
              id="P"
              name="P"
              value="40"
              min="5"
              max="145"
              required
            />
          </div>

          <div class="input-group">
            <label for="K">Potassium (K)</label>
            <input
              type="number"
              id="K"
              name="K"
              value="40"
              min="5"
              max="205"
              required
            />
          </div>

          <div class="input-group">
            <label for="temperature">Temperature (°C)</label>
            <input
              type="number"
              id="temperature"
              name="temperature"
              value="25"
              min="8"
              max="45"
              step="0.1"
              required
            />
          </div>

          <div class="input-group">
            <label for="humidity">Humidity (%)</label>
            <input
              type="number"
              id="humidity"
              name="humidity"
              value="80"
              min="14"
              max="100"
              step="0.1"
              required
            />
          </div>

          <div class="input-group">
            <label for="ph">pH Level</label>
            <input
              type="number"
              id="ph"
              name="ph"
              value="6.5"
              min="3.5"
              max="10"
              step="0.1"
              required
            />
          </div>

          <div class="input-group">
            <label for="rainfall">Rainfall (mm)</label>
            <input
              type="number"
              id="rainfall"
              name="rainfall"
              value="100"
              min="20"
              max="300"
              step="0.1"
              required
            />
          </div>
        </div>

        <button type="submit" class="btn">🔍 Get Recommendations</button>
      </form>

      <div class="loading" id="loading">
        Analyzing soil and climate conditions...
      </div>

      <div class="results" id="results">
        <h2>📊 Top 6 Recommended Crops</h2>
        <div class="crop-grid" id="cropGrid"></div>
      </div>

      <footer class="footer">
        <p>
          Developed by
            Priyanshu Saini
          </a>
        </p>
      </footer>
    </div>

    <!-- Link to external JavaScript file -->
    <script src="{{ url_for('static', filename='js/app.js') }}"></script>
  </body>
</html>
